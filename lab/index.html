<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词力对比实验 · Loopfolio</title>
  <style>
    :root {
      --ink: #f3f1fe;
      --muted: #a7a3bd;
      --accent: #6c4cf0;
      --accent-soft: #a48bff;
      --warm: #ffdcb8;
      --night: #0c0b12;
      --raised: #171425;
      --paper-stroke: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); font: 16px/1.45 "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", "Noto Sans CJK", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif; }
    body { max-width: 430px; margin: 0 auto; padding: 20px 18px 48px; }
    h1 { font: 600 1.25rem/1.3 "Songti SC", "Source Han Serif SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", ui-serif, serif; margin: 0 0 .35rem; }
    .lede, .note, .muted { color: var(--muted); }
    .lede { font-size: .9rem; margin: 0 0 1rem; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--raised); padding: 5px; border-radius: 12px; margin: .8rem 0 1rem; }
    .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); padding: .6rem .2rem; border-radius: 9px; font-weight: 600; font-size: .82rem; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: white; }
    .card { background: rgba(23,20,37,.72); border: 1px solid var(--paper-stroke); border-radius: 22px; padding: 16px; }
    label.k { font-size: .75rem; color: var(--muted); }
    .def { font: 500 1.05rem/1.35 "Songti SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", Georgia, serif; margin: .35rem 0 .8rem; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .target { font: 12px ui-monospace, monospace; color: color-mix(in srgb, var(--muted) 70%, transparent); }
    input[type="text"] {
      width: 100%; border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      background: var(--raised); color: white; border-radius: 14px; padding: 12px 14px; font-size: 16px;
      outline: none; transition: transform 55ms ease-out, box-shadow 55ms ease-out;
    }
    input.flash { transform: scale(1.035); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-soft) 55%, transparent); }
    input.wrong { border-color: color-mix(in srgb, var(--muted) 50%, transparent); }
    .meter { margin-top: 12px; }
    .meter .row { font-size: .72rem; margin-bottom: 6px; }
    .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 34%; background: var(--accent); border-radius: inherit; transition: width 80ms ease-out; }
    .actions { display: grid; gap: 10px; margin: 16px 0; }
    .actions button {
      appearance: none; border: 0; border-radius: 14px; padding: 13px; font-weight: 600; color: white; cursor: pointer;
    }
    .primary { background: var(--accent); }
    .secondary { background: var(--raised); border: 1px solid var(--paper-stroke); }
    .toast {
      text-align: center; font-size: .9rem; font-weight: 500; padding: 8px 14px; border-radius: 14px;
      background: rgba(255,255,255,.08); backdrop-filter: blur(16px); margin-bottom: 8px;
    }
    .note { font-size: .75rem; }
    .note strong { color: var(--accent-soft); font-weight: 600; }
    #layer {
      position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 180ms ease-out;
    }
    #layer.on { opacity: 1; }
    canvas { width: 100%; height: 100%; display: block; }
    .hero {
      position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(.96);
      text-align: center; width: min(22rem, 88vw); opacity: 0; transition: opacity 200ms ease-out, transform 280ms ease-out;
    }
    #layer.on.c .hero { opacity: 1; transform: translate(-50%,-50%) scale(1.18); }
    #layer.on.b .hero { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .ring { width: 196px; height: 196px; margin: 0 auto 14px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .pct {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font: 600 2rem/1 "Noto Sans CJK SC", sans-serif;
    }
    .ring .pct small { font-size: .75rem; font-weight: 500; color: var(--muted); margin-top: 4px; }
    .hero h2 { font: 600 2rem/1.2 "Songti SC", "Noto Sans CJK SC", Georgia, serif; letter-spacing: .08em; margin: 0 0 .4rem; }
    .hero p { margin: 0; color: rgba(255,255,255,.78); font-size: .9rem; }
    #layer.b .ring { display: none; }
    a { color: var(--accent-soft); }
  </style>
</head>
<body>
  <p class="muted" style="font-size:.8rem;margin:0 0 .6rem">Loopfolio · Debug 预览（非 App Store 页）</p>
  <h1 id="headline">A 击键层</h1>
  <p class="lede" id="blurb">打对：HitFlash + 迷你掌握条 + StreakBadge，≤300ms。从不是全屏电影。</p>
  <div class="seg" role="tablist">
    <button id="laneA" aria-pressed="true" type="button">A 击键层</button>
    <button id="laneC" aria-pressed="false" type="button">C 电影高潮</button>
  </div>
  <div class="card">
    <label class="k">看释义，敲英文</label>
    <div class="row">
      <div class="def">短暂的，转瞬即逝的</div>
      <div class="target" id="hint">ephemeral</div>
    </div>
    <input id="typed" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入 ephemeral">
    <div class="meter">
      <div class="row"><span>掌握</span><span id="pct">34%</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
  <div class="actions" id="actions"></div>
  <div class="toast" id="toast" hidden></div>
  <p class="note"><strong>规格</strong>　D-POWER-METER-SPEC.md / D-CINEMATIC-CLIMAX-SPEC.md。主对照 A vs C。B 是可选中间层（≤16 径向线）。C 先提交本局再播。</p>
  <p class="note"><a href="../">返回 Loopfolio</a></p>

  <div id="layer" aria-hidden="true">
    <canvas id="bloom"></canvas>
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
          <circle id="ringFill" cx="60" cy="60" r="48" fill="none" stroke="#6c4cf0" stroke-width="10" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="180"/>
        </svg>
        <div class="pct"><span id="heroPct">56%</span><small>已掌握</small></div>
      </div>
      <h2 id="cineTitle">今日清空</h2>
      <p id="cineSub">这一轮收束。可以停，也可以再来一局。</p>
    </div>
  </div>

  <script>
    const words = ["ephemeral", "lucid", "resonance", "threshold", "aether"];
    const defs = {
      ephemeral: "短暂的，转瞬即逝的",
      lucid: "清醒的，明晰的",
      resonance: "共振，余韵",
      threshold: "门槛，临界",
      aether: "以太，上层的气"
    };
    const copy = {
      A: ["A 击键层", "打对：HitFlash + 迷你掌握条 + StreakBadge，≤300ms。从不是全屏电影。"],
      C: ["C 电影高潮", "仅今日清完 / 词力大升级。先提交本局、收键盘，再播 ClimaxOverlay 1.8–2.8s。"],
    };
    let lane = "A";
    let target = "ephemeral";
    let typed = "";
    let mastery = 0.34;
    let cinemaTimer = 0;

    const $ = (id) => document.getElementById(id);
    const input = $("typed");
    const toast = $("toast");
    const layer = $("layer");
    const canvas = $("bloom");
    const ctx = canvas.getContext("2d");

    function setLane(next) {
      lane = next === "B" ? "A" : next;
      $("laneA").setAttribute("aria-pressed", String(lane === "A"));
      $("laneC").setAttribute("aria-pressed", String(lane === "C"));
      $("headline").textContent = copy[lane][0];
      $("blurb").textContent = copy[lane][1];
      hideToast();
      stopLayer();
      renderActions();
    }

    function renderActions() {
      const host = $("actions");
      const buttons = {
        A: [["primary","触发掌握跃迁",() => triggerA("掌握 +6%（无全屏）")],["secondary","触发本局清完",() => triggerA("本局记了一笔（无全屏）")]],
        C: [["primary","触发今日清完",() => triggerC("clear")],["secondary","触发词力大升级",() => triggerC("upgrade")]],
      };
      host.innerHTML = "";
      for (const [cls, label, fn] of buttons[lane]) {
        const b = document.createElement("button");
        b.className = cls;
        b.type = "button";
        b.textContent = label;
        b.onclick = fn;
        host.appendChild(b);
      }
      const optional = [
        ["secondary", "B 小高潮 · 掌握跃迁", () => triggerB("leap")],
        ["secondary", "B 小高潮 · 连击里程碑", () => triggerB("streak")],
      ];
      for (const [cls, label, fn] of optional) {
        const b = document.createElement("button");
        b.className = cls;
        b.type = "button";
        b.textContent = label;
        b.onclick = fn;
        host.appendChild(b);
      }
    }

    function renderMeter() {
      $("pct").textContent = Math.round(mastery * 100) + "%";
      $("bar").style.width = (mastery * 100) + "%";
    }

    function flash(ok) {
      input.classList.toggle("flash", ok);
      input.classList.toggle("wrong", !ok);
      setTimeout(() => input.classList.remove("flash"), 55);
    }

    function nextWord() {
      const i = words.indexOf(target);
      target = words[(i + 1) % words.length];
      typed = "";
      input.value = "";
      input.placeholder = "输入 " + target;
      $("hint").textContent = target;
      document.querySelector(".def").textContent = defs[target];
    }

    input.addEventListener("input", () => {
      const raw = input.value.toLowerCase().replace(/[^a-z]/g, "");
      if (target.startsWith(raw) && raw.length === typed.length + 1) {
        typed = raw;
        mastery = Math.min(1, mastery + 0.018);
        flash(true);
        renderMeter();
        if (typed === target) nextWord();
      } else if (target.startsWith(raw) && raw.length < typed.length) {
        typed = raw;
      } else {
        input.value = typed;
        flash(false);
      }
    });

    function showToast(text) {
      toast.hidden = false;
      toast.textContent = text;
      clearTimeout(showToast._t);
      showToast._t = setTimeout(hideToast, 1400);
    }
    function hideToast() { toast.hidden = true; }

    function triggerA(text) {
      mastery = Math.min(1, mastery + 0.06);
      renderMeter();
      showToast(text);
    }

    function triggerB(kind) {
      mastery = Math.min(1, mastery + 0.06);
      renderMeter();
      hideToast();
      input.blur();
      playLayer("b", kind, kind === "streak" ? 1000 : 950);
    }

    function triggerC(kind) {
      input.blur();
      hideToast();
      const surge = kind === "upgrade" ? 0.22 : 0.12;
      mastery = Math.min(1, mastery + surge);
      renderMeter();
      playLayer("c", kind, kind === "upgrade" ? 2500 : 2200);
    }

    function sizeCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function envelope(p) {
      if (p < 0.18) return p / 0.18;
      if (p > 0.72) return Math.max(0, 1 - (p - 0.72) / 0.28);
      return 1;
    }

    function playLayer(mode, kind, duration) {
      layer.className = "on " + mode;
      const titles = {
        leap: ["掌握跃迁", "这一词站住了。短光，不占场。"],
        streak: ["连击", "节奏还在。小高潮，不是电影。"],
        clear: ["今日清空", "这一轮收束。可以停，也可以再来一局。"],
        upgrade: ["词力提升", "词力上了一个台阶。没有对手，只有光线。"],
      };
      $("cineTitle").textContent = titles[kind][0];
      $("cineSub").textContent = titles[kind][1];
      $("heroPct").textContent = Math.round(mastery * 100) + "%";
      const circ = 2 * Math.PI * 48;
      $("ringFill").setAttribute("stroke-dashoffset", String(circ * (1 - mastery)));
      sizeCanvas();
      const start = performance.now();
      cancelAnimationFrame(cinemaTimer);
      const tick = (now) => {
        const p = Math.min(1, (now - start) / duration);
        if (mode === "c") drawClimax(p, kind);
        else drawSmall(p, kind);
        if (p < 1) cinemaTimer = requestAnimationFrame(tick);
        else stopLayer();
      };
      cinemaTimer = requestAnimationFrame(tick);
    }

    function stopLayer() {
      layer.className = "";
      cancelAnimationFrame(cinemaTimer);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }

    function drawSmall(progress, kind) {
      const w = innerWidth, h = innerHeight, env = envelope(progress);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = `rgba(12,11,18,${0.26 * env})`;
      ctx.fillRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.42, radius = Math.min(w, h);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.28);
      g.addColorStop(0, `rgba(164,139,255,${0.32 * env})`);
      g.addColorStop(1, "rgba(164,139,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawClimax(progress, kind) {
      const w = innerWidth, h = innerHeight;
      const elapsed = progress * (kind === "upgrade" ? 2.5 : 2.2);
      const dim = elapsed < 0.2 ? 0.6 * (elapsed / 0.2) : elapsed > 1.9 ? 0.6 * Math.max(0, 1 - (elapsed - 1.9) / 0.4) : 0.6;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = `rgba(4,3,10,${dim})`;
      ctx.fillRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.38;
      if (elapsed >= 0.38 && elapsed <= 0.42) {
        ctx.fillStyle = "rgba(255,255,255,0.12)";
        ctx.fillRect(0, 0, w, h);
      }
      if (elapsed >= 0.4 && elapsed <= 1.6) {
        const local = elapsed - 0.4;
        for (let i = 0; i < 24; i++) {
          const u = (i * 1.618) % 1;
          const delay = u * 0.18;
          const life = 0.7 + u * 0.5;
          if (local < delay || local - delay > life) continue;
          const t = (local - delay) / life;
          const angle = i * (Math.PI * 2 / 24) + u * 0.2;
          const dist = 108 + t * w * 0.38;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist * 0.86 + t * t * 28;
          ctx.globalAlpha = 0.92 * (1 - t);
          ctx.fillStyle = i % 3 === 2 ? "#ffdcb8" : i % 2 ? "#a48bff" : "#6c4cf0";
          ctx.fillRect(x - 3, y - 1.2, 6 + (i % 3), 2.4);
          ctx.globalAlpha = 1;
        }
      }
    }

    $("laneA").onclick = () => setLane("A");
    $("laneC").onclick = () => setLane("C");
    renderMeter();
    renderActions();

    const params = new URLSearchParams(location.search);
    if (params.get("lane")) setLane(params.get("lane").toUpperCase());
    if (params.get("typed")) {
      const seed = params.get("typed").toLowerCase().replace(/[^a-z]/g, "");
      if (target.startsWith(seed)) {
        typed = seed;
        input.value = seed;
        mastery = Math.min(1, 0.34 + seed.length * 0.018);
        renderMeter();
      }
    }
    if (params.get("toast")) {
      setLane("A");
      showToast(params.get("toast") === "clear" ? "本局记了一笔（无全屏）" : "掌握 +6%（无全屏）");
    }
    if (params.get("cinema")) {
      const kind = params.get("cinema");
      const mode = kind === "leap" || kind === "streak" ? "B" : "C";
      setLane(mode);
      mastery = Math.min(1, mastery + (kind === "upgrade" ? 0.22 : 0.12));
      renderMeter();
      const frozen = Number(params.get("progress") || 0.5);
      const duration = mode === "B" ? 1000 : kind === "upgrade" ? 2500 : 2200;
      layer.className = "on " + mode.toLowerCase();
      const titles = {
        leap: ["掌握跃迁", "这一词站住了。短光，不占场。"],
        streak: ["连击", "节奏还在。小高潮，不是电影。"],
        clear: ["今日清空", "这一轮收束。可以停，也可以再来一局。"],
        upgrade: ["词力提升", "词力上了一个台阶。没有对手，只有光线。"],
      };
      $("cineTitle").textContent = (titles[kind] || titles.clear)[0];
      $("cineSub").textContent = (titles[kind] || titles.clear)[1];
      $("heroPct").textContent = Math.round(mastery * 100) + "%";
      $("ringFill").setAttribute("stroke-dashoffset", String(2 * Math.PI * 48 * (1 - mastery)));
      sizeCanvas();
      if (mode === "C") drawClimax(frozen, kind);
      else drawSmall(frozen, kind);
    }
  </script>
</body>
</html>
