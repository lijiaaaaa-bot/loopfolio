<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词力对比实验 · A / B / C · Loopfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3f1fe;
      --muted: #a7a3bd;
      --accent: #6c4cf0;
      --accent-soft: #a48bff;
      --warm: #ffdcb8;
      --night: #0c0b12;
      --raised: #171425;
      --paper-stroke: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.45 "Noto Sans SC", "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    body {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px 18px 48px;
      background: var(--night);
      transition: background 280ms ease-out;
    }
    body[data-lane="C"] {
      background:
        radial-gradient(ellipse at 50% -10%, rgba(108,76,240,.28), transparent 46%),
        radial-gradient(ellipse at 80% 110%, rgba(164,139,255,.10), transparent 42%),
        #07060d;
    }
    body[data-lane="B"] {
      background:
        radial-gradient(ellipse at 50% 8%, rgba(164,139,255,.10), transparent 40%),
        #0c0b12;
    }
    h1 { font: 600 1.25rem/1.3 "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Sans CJK SC", ui-serif, serif; margin: 0 0 .35rem; }
    .lede, .note, .muted { color: var(--muted); }
    .lede { font-size: .9rem; margin: 0 0 1rem; }
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: var(--raised);
      padding: 5px;
      border-radius: 12px;
      margin: .8rem 0 1rem;
    }
    .seg button {
      appearance: none; border: 0; background: transparent; color: var(--muted);
      padding: .62rem .15rem; border-radius: 9px; font-weight: 600; font-size: .78rem;
    }
    .seg button[aria-pressed="true"] { background: var(--accent); color: white; }
    .card { background: rgba(23,20,37,.72); border: 1px solid var(--paper-stroke); border-radius: 22px; padding: 16px; }
    label.k { font-size: .75rem; color: var(--muted); }
    .def { font: 500 1.05rem/1.35 "Songti SC", "Noto Serif CJK SC", "Noto Sans CJK SC", Georgia, serif; margin: .35rem 0 .8rem; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .target { font: 12px ui-monospace, monospace; color: color-mix(in srgb, var(--muted) 70%, transparent); }
    input[type="text"] {
      width: 100%; border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      background: var(--raised); color: white; border-radius: 14px; padding: 12px 14px; font-size: 16px;
      outline: none; transition: transform 55ms ease-out, box-shadow 55ms ease-out;
    }
    input.flash { transform: scale(1.035); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-soft) 55%, transparent); }
    input.wrong { border-color: color-mix(in srgb, var(--muted) 50%, transparent); }
    .meter { margin-top: 12px; }
    .meter .row { font-size: .72rem; margin-bottom: 6px; }
    .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 34%; background: var(--accent); border-radius: inherit; transition: width 80ms ease-out; }
    .actions { display: grid; gap: 10px; margin: 16px 0; }
    .actions button {
      appearance: none; border: 0; border-radius: 14px; padding: 13px; font-weight: 600; color: white; cursor: pointer;
    }
    .primary { background: var(--accent); }
    .secondary { background: var(--raised); border: 1px solid var(--paper-stroke); }
    .toast {
      text-align: center; font-size: .9rem; font-weight: 500; padding: 8px 14px; border-radius: 14px;
      background: rgba(255,255,255,.08); backdrop-filter: blur(16px); margin-bottom: 8px;
    }
    .note { font-size: .75rem; }
    .note strong { color: var(--accent-soft); font-weight: 600; }
    #layer {
      position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 30;
      transition: opacity 160ms ease-out;
    }
    #layer.on { opacity: 1; }
    #layer.on.b { background: transparent; }
    #layer.on.c {
      pointer-events: auto;
      background: rgba(4, 3, 12, 0.64);
    }
    .veil { position: absolute; inset: 0; }
    #layer.b .veil {
      background: radial-gradient(circle at 50% 42%, rgba(164,139,255,.30), rgba(12,11,18,.22) 42%, transparent 72%);
    }
    #layer.c .veil {
      background:
        radial-gradient(ellipse at 50% 36%, rgba(164,139,255,.40) 0%, rgba(108,76,240,.16) 28%, transparent 56%),
        radial-gradient(ellipse at 50% 110%, rgba(0,0,0,.35), transparent 46%);
    }
    canvas { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
    .hero {
      position: fixed; left: 50%; top: 44%; transform: translate(-50%,-50%) scale(.92);
      text-align: center; width: min(22rem, 88vw); opacity: 0;
      transition: opacity 220ms ease-out, transform 320ms cubic-bezier(.16,1,.3,1), filter 320ms ease-out;
    }
    #layer.on.b .hero { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    #layer.on.c .hero {
      opacity: 1;
      transform: translate(-50%,-50%) scale(1.22);
      filter: drop-shadow(0 0 48px rgba(164,139,255,.62)) drop-shadow(0 18px 40px rgba(0,0,0,.55));
    }
    .ring { width: 220px; height: 220px; margin: 0 auto 18px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); filter: drop-shadow(0 0 16px rgba(164,139,255,.8)); }
    .ring .pct {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font: 600 2.25rem/1 "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
      text-shadow: 0 2px 18px rgba(0,0,0,.55);
    }
    .ring .pct small { font-size: .75rem; font-weight: 500; color: rgba(243,241,254,.72); margin-top: 4px; }
    .hero h2 {
      font: 600 2.5rem/1.15 "Noto Serif SC", "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
      letter-spacing: .16em; margin: 0 0 .45rem;
      text-shadow: 0 2px 24px rgba(0,0,0,.65);
    }
    .hero p { margin: 0; color: rgba(255,255,255,.82); font-size: .95rem; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
    #cineCopy { transition: opacity 180ms ease-out; }
    #layer.b .ring { display: none; }
    #layer.b .hero h2 { font-size: 1.35rem; letter-spacing: .06em; }
    #layer.reduced .veil { background: rgba(0,0,0,.58); }
    #layer.reduced .hero { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: none; }
    #continue {
      display: none; margin: 18px auto 0; appearance: none; border: 0; border-radius: 999px;
      padding: 10px 28px; background: var(--accent); color: white; font-weight: 600; pointer-events: auto;
    }
    #layer.on.c #continue { display: inline-block; }
    a { color: var(--accent-soft); }
    @media (prefers-reduced-motion: reduce) {
      .hero, input, body { transition: none !important; }
    }
  </style>
</head>
<body data-lane="C">
  <p class="muted" style="font-size:.8rem;margin:0 0 .6rem">Loopfolio · Debug 预览（非 App Store 页）</p>
  <h1 id="headline">C · 电影高潮</h1>
  <p class="lede" id="blurb">今日清完 / 词力大升级。压暗房间、放大仪表、色屑、大字。打开本页就会先播一段 C。</p>
  <div class="seg" role="tablist">
    <button id="laneA" aria-pressed="false" type="button">A · 手感</button>
    <button id="laneB" aria-pressed="false" type="button">B · 小高潮</button>
    <button id="laneC" aria-pressed="true" type="button">C · 电影</button>
  </div>
  <div class="card">
    <label class="k">看释义，敲英文</label>
    <div class="row">
      <div class="def">短暂的，转瞬即逝的</div>
      <div class="target" id="hint">ephemeral</div>
    </div>
    <input id="typed" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入 ephemeral">
    <div class="meter">
      <div class="row"><span>掌握</span><span id="pct">34%</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
  <div class="actions" id="actions"></div>
  <div class="toast" id="toast" hidden></div>
  <p class="note"><strong>规格</strong>　三段：A 手感 ≤300ms · B 小高潮 0.6–1.2s · C 电影 1.8–2.8s。C 先交局、收键盘再播。无卡通 / 金币 / Metal。</p>
  <p class="note"><a href="../">返回 Loopfolio</a></p>

  <div id="layer" aria-hidden="true">
    <div class="veil"></div>
    <canvas id="bloom"></canvas>
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>
          <circle id="ringFill" cx="60" cy="60" r="48" fill="none" stroke="#a48bff" stroke-width="11" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="180"/>
        </svg>
        <div class="pct"><span id="heroPct">46%</span><small>已掌握</small></div>
      </div>
      <div id="cineCopy">
        <h2 id="cineTitle">今日清空</h2>
        <p id="cineSub">这一轮收束。可以停，也可以再来一局。</p>
      </div>
      <button id="continue" type="button">继续</button>
    </div>
  </div>

  <script>
    const words = ["ephemeral", "lucid", "resonance", "threshold", "aether"];
    const defs = {
      ephemeral: "短暂的，转瞬即逝的",
      lucid: "清醒的，明晰的",
      resonance: "共振，余韵",
      threshold: "门槛，临界",
      aether: "以太，上层的气"
    };
    const copy = {
      A: ["A · 手感", "打对：HitFlash + 迷你掌握条 + StreakBadge，≤300ms。从不是全屏电影。"],
      B: ["B · 小高潮", "掌握跃迁 / 连击里程碑。0.6–1.2s，≤16 条径向线。改不了 App 气质。"],
      C: ["C · 电影高潮", "今日清完 / 词力大升级。压暗房间、放大仪表、色屑、大字。打开本页就会先播一段 C。"],
    };
    let lane = "C";
    let target = "ephemeral";
    let typed = "";
    let mastery = 0.34;
    let cinemaTimer = 0;
    let fromMastery = 0.34;

    const $ = (id) => document.getElementById(id);
    const input = $("typed");
    const toast = $("toast");
    const layer = $("layer");
    const canvas = $("bloom");
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setLane(next, { demo = true } = {}) {
      lane = next === "A" || next === "B" || next === "C" ? next : "C";
      document.body.dataset.lane = lane;
      $("laneA").setAttribute("aria-pressed", String(lane === "A"));
      $("laneB").setAttribute("aria-pressed", String(lane === "B"));
      $("laneC").setAttribute("aria-pressed", String(lane === "C"));
      $("headline").textContent = copy[lane][0];
      $("blurb").textContent = copy[lane][1];
      hideToast();
      stopLayer();
      renderActions();
      if (lane === "A") {
        input.focus();
      } else {
        input.blur();
        if (demo) {
          if (lane === "B") triggerB("leap");
          if (lane === "C") triggerC("clear");
        }
      }
    }

    function renderActions() {
      const host = $("actions");
      const buttons = {
        A: [
          ["primary", "触发掌握跃迁", () => triggerA("掌握 +6%（无全屏）")],
          ["secondary", "触发本局清完", () => triggerA("本局记了一笔（无全屏）")],
        ],
        B: [
          ["primary", "触发掌握跃迁", () => triggerB("leap")],
          ["secondary", "触发连击里程碑", () => triggerB("streak")],
        ],
        C: [
          ["primary", "触发今日清完", () => triggerC("clear")],
          ["secondary", "触发词力大升级", () => triggerC("upgrade")],
        ],
      };
      host.innerHTML = "";
      for (const [cls, label, fn] of buttons[lane]) {
        const b = document.createElement("button");
        b.className = cls;
        b.type = "button";
        b.textContent = label;
        b.onclick = fn;
        host.appendChild(b);
      }
    }

    function renderMeter() {
      $("pct").textContent = Math.round(mastery * 100) + "%";
      $("bar").style.width = (mastery * 100) + "%";
    }

    function flash(ok) {
      input.classList.toggle("flash", ok);
      input.classList.toggle("wrong", !ok);
      setTimeout(() => input.classList.remove("flash"), 55);
    }

    function nextWord() {
      const i = words.indexOf(target);
      target = words[(i + 1) % words.length];
      typed = "";
      input.value = "";
      input.placeholder = "输入 " + target;
      $("hint").textContent = target;
      document.querySelector(".def").textContent = defs[target];
    }

    input.addEventListener("input", () => {
      const raw = input.value.toLowerCase().replace(/[^a-z]/g, "");
      if (target.startsWith(raw) && raw.length === typed.length + 1) {
        typed = raw;
        mastery = Math.min(1, mastery + 0.018);
        flash(true);
        renderMeter();
        if (typed === target) nextWord();
      } else if (target.startsWith(raw) && raw.length < typed.length) {
        typed = raw;
      } else {
        input.value = typed;
        flash(false);
      }
    });

    function showToast(text) {
      toast.hidden = false;
      toast.textContent = text;
      clearTimeout(showToast._t);
      showToast._t = setTimeout(hideToast, 1400);
    }
    function hideToast() { toast.hidden = true; }

    function triggerA(text) {
      mastery = Math.min(1, mastery + 0.06);
      renderMeter();
      showToast(text);
    }

    function triggerB(kind) {
      if (document.activeElement === input) input.blur();
      mastery = Math.min(1, mastery + 0.06);
      renderMeter();
      hideToast();
      playLayer("b", kind, kind === "streak" ? 1000 : 950);
    }

    function triggerC(kind) {
      if (document.activeElement === input) {
        input.blur();
        requestAnimationFrame(() => playC(kind));
        return;
      }
      playC(kind);
    }

    function playC(kind) {
      if (document.activeElement === input) return;
      hideToast();
      fromMastery = mastery;
      const surge = kind === "upgrade" ? 0.22 : 0.12;
      mastery = Math.min(1, mastery + surge);
      renderMeter();
      playLayer("c", kind, kind === "upgrade" ? 2500 : 2200);
    }

    function sizeCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function envelope(p) {
      if (p < 0.18) return p / 0.18;
      if (p > 0.72) return Math.max(0, 1 - (p - 0.72) / 0.28);
      return 1;
    }

    function easeOut(t) {
      const x = Math.min(1, Math.max(0, t));
      return 1 - Math.pow(1 - x, 3);
    }

    function titlesFor(kind) {
      return {
        leap: ["掌握跃迁", "这一词站住了。短光，不占场。"],
        streak: ["连击", "节奏还在。小高潮，不是电影。"],
        clear: ["今日清空", "这一轮收束。可以停，也可以再来一局。"],
        upgrade: ["词力提升", "词力上了一个台阶。没有对手，只有光线。"],
      }[kind] || ["今日清空", "这一轮收束。可以停，也可以再来一局。"];
    }

    function applyHero(kind, fill) {
      const t = titlesFor(kind);
      $("cineTitle").textContent = t[0];
      $("cineSub").textContent = t[1];
      $("heroPct").textContent = Math.round(fill * 100) + "%";
      $("ringFill").setAttribute("stroke-dashoffset", String(2 * Math.PI * 48 * (1 - fill)));
    }

    function playLayer(mode, kind, duration) {
      if (reduceMotion) {
        playReduced(mode, kind);
        return;
      }
      layer.className = "on " + mode;
      applyHero(kind, mastery);
      sizeCanvas();
      const start = performance.now();
      cancelAnimationFrame(cinemaTimer);
      const tick = (now) => {
        const p = Math.min(1, (now - start) / duration);
        if (mode === "c") {
          const elapsed = p * (kind === "upgrade" ? 2.5 : 2.2);
          const fill = meterFill(elapsed, fromMastery, mastery);
          applyHero(kind, fill);
          const titleOn = elapsed >= 0.90;
          $("cineCopy").style.opacity = titleOn ? String(Math.min(1, (elapsed - 0.90) / 0.28)) : "0";
          drawClimax(p, kind);
        } else {
          $("cineCopy").style.opacity = "1";
          drawSmall(p, kind);
        }
        if (p < 1) cinemaTimer = requestAnimationFrame(tick);
        else stopLayer();
      };
      cinemaTimer = requestAnimationFrame(tick);
    }

    function playReduced(mode, kind) {
      layer.className = "on " + mode + " reduced";
      applyHero(kind, mastery);
      $("cineCopy").style.opacity = "1";
      sizeCanvas();
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.fillStyle = "rgba(0,0,0,0.58)";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      clearTimeout(playReduced._t);
      playReduced._t = setTimeout(stopLayer, 360);
    }

    function meterFill(elapsed, from, to) {
      if (elapsed < 0.15) return from;
      if (elapsed >= 0.90) return to;
      return from + (to - from) * easeOut((elapsed - 0.15) / 0.75);
    }

    function stopLayer() {
      layer.className = "";
      cancelAnimationFrame(cinemaTimer);
      $("cineCopy").style.opacity = "";
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }

    function drawSmall(progress, kind) {
      const w = innerWidth, h = innerHeight, env = envelope(progress);
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.42, radius = Math.min(w, h);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.26);
      g.addColorStop(0, `rgba(164,139,255,${0.30 * env})`);
      g.addColorStop(1, "rgba(164,139,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.26, 0, Math.PI * 2);
      ctx.fill();
      const rays = kind === "streak" ? 16 : 12;
      ctx.strokeStyle = `rgba(108,76,240,${0.42 * env})`;
      ctx.lineWidth = 1.4;
      ctx.lineCap = "round";
      for (let i = 0; i < rays; i++) {
        const a = i * (Math.PI * 2 / rays);
        const outer = radius * (0.16 + 0.08 * env);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
        ctx.stroke();
      }
    }

    function drawClimax(progress, kind) {
      const w = innerWidth, h = innerHeight;
      const duration = kind === "upgrade" ? 2.5 : 2.2;
      const elapsed = progress * duration;
      const dim = elapsed < 0.2
        ? 0.64 * (elapsed / 0.2)
        : elapsed > duration - 0.4
          ? 0.64 * Math.max(0, 1 - (elapsed - (duration - 0.4)) / 0.4)
          : 0.64;
      const cx = w * 0.5, cy = h * 0.38;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = `rgba(4,3,12,${dim})`;
      ctx.fillRect(0, 0, w, h);

      const vig = ctx.createRadialGradient(cx, cy, Math.min(w, h) * 0.12, cx, cy, Math.hypot(w, h) * 0.62);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, `rgba(0,0,0,${0.48 * (dim / 0.64)})`);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);

      const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.46);
      bloom.addColorStop(0, `rgba(164,139,255,${0.40 * (dim / 0.64)})`);
      bloom.addColorStop(0.42, `rgba(108,76,240,${0.16 * (dim / 0.64)})`);
      bloom.addColorStop(1, "rgba(108,76,240,0)");
      ctx.fillStyle = bloom;
      ctx.fillRect(0, 0, w, h);

      const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90);
      core.addColorStop(0, `rgba(255,220,184,${0.16 * (dim / 0.64)})`);
      core.addColorStop(1, "rgba(255,220,184,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx, cy, 90, 0, Math.PI * 2);
      ctx.fill();

      if (elapsed >= 0.32 && elapsed <= 1.55) {
        const t = easeOut((elapsed - 0.32) / 1.23);
        ctx.strokeStyle = `rgba(164,139,255,${0.50 * (1 - t)})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(cx, cy, 96 + t * Math.min(w, h) * 0.30, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (elapsed >= 0.38 && elapsed <= 0.42) {
        ctx.fillStyle = "rgba(255,255,255,0.12)";
        ctx.fillRect(0, 0, w, h);
      }

      if (elapsed >= 0.4 && elapsed <= 1.6) {
        const local = elapsed - 0.4;
        for (let i = 0; i < 24; i++) {
          const u = (i * 1.618) % 1;
          const delay = u * 0.16;
          const life = 0.75 + u * 0.4;
          if (local < delay || local - delay > life) continue;
          const t = (local - delay) / life;
          const angle = i * (Math.PI * 2 / 24) + u * 0.18;
          const dist = 112 + t * w * 0.42;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist * 0.84 + t * t * 32;
          ctx.globalAlpha = 0.96 * (1 - t);
          ctx.fillStyle = i % 3 === 2 ? "#ffdcb8" : i % 2 ? "#a48bff" : "#6c4cf0";
          const rw = 9 + (i % 3) * 3;
          const rh = 2.6 + (i % 2);
          ctx.fillRect(x - rw / 2, y - rh / 2, rw, rh);
          ctx.globalAlpha = 1;
        }
      }
    }

    $("laneA").onclick = () => setLane("A");
    $("laneB").onclick = () => setLane("B");
    $("laneC").onclick = () => setLane("C");
    $("continue").onclick = () => stopLayer();
    renderMeter();
    renderActions();

    const params = new URLSearchParams(location.search);
    if (params.get("lane")) {
      setLane(params.get("lane").toUpperCase(), { demo: !params.get("cinema") });
    } else if (!params.get("cinema") && !params.get("toast") && !params.get("typed")) {
      setLane("C", { demo: true });
    }
    if (params.get("typed")) {
      const seed = params.get("typed").toLowerCase().replace(/[^a-z]/g, "");
      if (target.startsWith(seed)) {
        typed = seed;
        input.value = seed;
        mastery = Math.min(1, 0.34 + seed.length * 0.018);
        renderMeter();
      }
    }
    if (params.get("toast")) {
      setLane("A", { demo: false });
      showToast(params.get("toast") === "clear" ? "本局记了一笔（无全屏）" : "掌握 +6%（无全屏）");
    }
    if (params.get("cinema")) {
      const kind = params.get("cinema");
      const mode = kind === "leap" || kind === "streak" ? "B" : "C";
      setLane(mode, { demo: false });
      fromMastery = mastery;
      mastery = Math.min(1, mastery + (kind === "upgrade" ? 0.22 : 0.12));
      renderMeter();
      const frozen = Number(params.get("progress") || 0.55);
      const duration = mode === "B" ? 1000 : kind === "upgrade" ? 2500 : 2200;
      layer.className = "on " + mode.toLowerCase();
      applyHero(kind, meterFill(frozen * duration, fromMastery, mastery));
      $("cineCopy").style.opacity = mode === "C" && frozen * duration < 0.9 ? "0" : "1";
      sizeCanvas();
      if (mode === "C") drawClimax(frozen, kind);
      else drawSmall(frozen, kind);
    }
  </script>
</body>
</html>
