<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真局结算 · Loopfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3f1fe; --muted: #a7a3bd; --accent: #6c4cf0; --accent-soft: #a48bff;
      --warm: #ffdcb8; --night: #0c0b12; --raised: #171425; --paper-stroke: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--ink); font: 16px/1.45 "Noto Sans SC", "SF Pro Text", "PingFang SC", sans-serif; }
    body { max-width: 430px; margin: 0 auto; padding: 20px 18px 48px; background: var(--night); }
    h1 { font: 600 1.7rem/1.25 "Noto Serif SC", "Songti SC", ui-serif, serif; margin: 0 0 .4rem; }
    .lede, .note, .muted { color: var(--muted); }
    .lede { font-size: .9rem; margin: 0 0 1.2rem; }
    .note { font-size: .75rem; }
    .card { background: rgba(23,20,37,.72); border: 1px solid var(--paper-stroke); border-radius: 22px; padding: 16px; }
    .hero-home { text-align: center; margin: 8px 0 18px; }
    .ring { width: 220px; height: 220px; margin: 0 auto 8px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .pct { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 600 2.25rem/1 "Noto Sans SC", sans-serif; }
    .ring .pct small { font-size: .75rem; font-weight: 500; color: var(--muted); margin-top: 4px; }
    button.primary, button.secondary {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 18px; font-weight: 600; color: white; width: 100%; cursor: pointer;
    }
    button.primary { background: var(--accent); }
    button.secondary { background: var(--raised); border: 1px solid var(--paper-stroke); margin-top: 10px; }
    .def { font: 600 1.7rem/1.3 "Noto Serif SC", "Songti SC", ui-serif, serif; margin: .2rem 0 .5rem; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .target { font: 12px ui-monospace, monospace; color: color-mix(in srgb, var(--muted) 70%, transparent); }
    input[type="text"] {
      width: 100%; border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      background: var(--raised); color: white; border-radius: 14px; padding: 12px 14px; font-size: 16px; outline: none;
    }
    input.flash { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-soft) 55%, transparent); }
    .meter { margin-top: 12px; }
    .meter .row { font-size: .72rem; margin-bottom: 6px; }
    .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 34%; background: var(--accent); border-radius: inherit; }
    .badge { display: inline-block; color: var(--accent-soft); background: rgba(164,139,255,.18); border-radius: 999px; padding: 3px 10px; font-size: .8rem; }
    #layer { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 30; }
    #layer.on { opacity: 1; }
    #layer.on.b { background: transparent; }
    #layer.on.c { pointer-events: auto; background: rgba(4, 3, 12, 0.64); }
    .veil { position: absolute; inset: 0; }
    #layer.on.c .veil {
      background:
        radial-gradient(ellipse at 50% 36%, rgba(164,139,255,.40) 0%, rgba(108,76,240,.16) 28%, transparent 56%),
        radial-gradient(ellipse at 50% 110%, rgba(0,0,0,.35), transparent 46%);
    }
    canvas { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
    .hero {
      position: fixed; left: 50%; top: 44%; transform: translate(-50%,-50%) scale(.92);
      text-align: center; width: min(22rem, 88vw); opacity: 0;
    }
    #layer.on.c .hero { opacity: 1; transform: translate(-50%,-50%) scale(1.22); filter: drop-shadow(0 0 48px rgba(164,139,255,.62)); }
    #layer.on.b .hero { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    #layer.on.b .ring { display: none; }
    .hero h2 { font: 600 2.5rem/1.15 "Noto Serif SC", "Songti SC", ui-serif, serif; letter-spacing: .16em; margin: 0 0 .45rem; }
    #layer.on.b .hero h2 { font-size: 1.35rem; letter-spacing: .06em; }
    .hero p { margin: 0; color: rgba(255,255,255,.82); font-size: .95rem; }
    #continue {
      display: none; margin: 18px auto 0; appearance: none; border: 0; border-radius: 999px;
      padding: 10px 28px; background: var(--accent); color: white; font-weight: 600;
    }
    #layer.on.c #continue { display: inline-block; }
    a { color: var(--accent-soft); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p class="muted" style="font-size:.8rem;margin:0 0 .6rem">Loopfolio · 生产结算预览（对照 iOS TypingSessionView）</p>

  <section id="home">
    <h1>词力 / 今日</h1>
    <p class="lede" id="homeLede">还剩 <span id="homeRemain">2</span> 词。打完今日队列才播 C「今日清空」。</p>
    <div class="hero-home">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
          <circle id="homeRing" cx="60" cy="60" r="48" fill="none" stroke="#a48bff" stroke-width="11" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="180"/>
        </svg>
        <div class="pct"><span id="homePct">34%</span><small>已掌握</small></div>
      </div>
    </div>
    <button class="primary" id="start" type="button">开始打字</button>
    <p class="note" style="margin-top:14px"><a href="./">A / B / C 实验室</a>　·　<a href="../">返回 Loopfolio</a></p>
  </section>

  <section id="round" hidden>
    <div class="row" style="margin-bottom:10px">
      <span class="muted" id="remainLabel">还剩 2 词</span>
      <span class="badge" id="streak" hidden>连击 0</span>
    </div>
    <div class="card">
      <div class="row">
        <div class="def" id="gloss">短暂的，转瞬即逝的</div>
        <div class="target" id="hint">ephemeral</div>
      </div>
      <input id="typed" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入 ephemeral">
      <div class="meter">
        <div class="row"><span>掌握</span><span id="pct">34%</span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>
    <div id="settled" hidden class="card" style="margin-top:14px">
      <h1 style="font-size:1.4rem">今日队列已清空</h1>
      <p class="lede">可以停，也可以再来一局。</p>
      <button class="primary" id="backHome" type="button">回到首页</button>
    </div>
  </section>

  <div id="layer" aria-hidden="true">
    <div class="veil"></div>
    <canvas id="bloom"></canvas>
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>
          <circle id="ringFill" cx="60" cy="60" r="48" fill="none" stroke="#a48bff" stroke-width="11" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="180"/>
        </svg>
        <div class="pct"><span id="heroPct">46%</span><small>已掌握</small></div>
      </div>
      <div id="cineCopy">
        <h2 id="cineTitle">今日清空</h2>
        <p id="cineSub">这一轮收束。可以停，也可以再来一局。</p>
      </div>
      <button id="continue" type="button">继续</button>
    </div>
  </div>

  <script>
    const WORDS = ["ephemeral", "lucid", "resonance", "threshold", "aether"];
    const DEFS = {
      ephemeral: "短暂的，转瞬即逝的",
      lucid: "清醒的，明晰的",
      resonance: "共振，余韵",
      threshold: "门槛，临界",
      aether: "以太，上层的气",
    };
    const MAJOR = 0.22;
    const params = new URLSearchParams(location.search);
    const remainingWanted = Math.max(1, Math.min(5, Number(params.get("remaining") || 1)));

    let mastery = 0.34;
    let startMastery = 0.34;
    let clearedToday = false;
    let queue = [];
    let target = "";
    let typed = "";
    let streak = 0;
    let settled = false;
    let cinemaTimer = 0;
    let fromMastery = 0.34;
    let playingC = false;

    const $ = (id) => document.getElementById(id);
    const input = $("typed");
    const canvas = $("bloom");
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setRing(el, value) {
      el.setAttribute("stroke-dashoffset", String(2 * Math.PI * 48 * (1 - value)));
    }
    function renderHome() {
      $("homeRemain").textContent = String(clearedToday ? 0 : remainingWanted);
      $("homePct").textContent = Math.round(mastery * 100) + "%";
      setRing($("homeRing"), mastery);
      $("homeLede").textContent = clearedToday
        ? "今日队列已清空。再来一局只会在词力大升级时播 C。"
        : `还剩 ${remainingWanted} 词。打完今日队列才播 C「今日清空」。`;
      $("start").textContent = clearedToday ? "再来一局" : "开始打字";
    }
    function renderRound() {
      $("remainLabel").textContent = settled ? "本局收束" : `还剩 ${queue.length + (settled ? 0 : 1)} 词`;
      $("gloss").textContent = DEFS[target];
      $("hint").textContent = target;
      $("pct").textContent = Math.round(mastery * 100) + "%";
      $("bar").style.width = (mastery * 100) + "%";
      input.placeholder = "输入 " + target;
      if (streak > 0) {
        $("streak").hidden = false;
        $("streak").textContent = "连击 " + streak;
      }
    }

    function cinemaKinds(cleared, gain) {
      const kinds = [];
      if (cleared && !clearedToday) kinds.push("clear");
      if (gain >= MAJOR) kinds.push("upgrade");
      return kinds;
    }

    function titlesFor(kind) {
      return {
        leap: ["掌握跃迁", "这一词站住了。短光，不占场。"],
        streak: ["连击", "节奏还在。小高潮，不是电影。"],
        clear: ["今日清空", "这一轮收束。可以停，也可以再来一局。"],
        upgrade: ["词力提升", "词力上了一个台阶。没有对手，只有光线。"],
        merge: ["今日清空 · 词力提升", "词力上了一个台阶。没有对手，只有光线。"],
      }[kind];
    }

    function startRound() {
      queue = WORDS.slice(0, remainingWanted);
      target = queue.shift();
      typed = "";
      streak = 0;
      settled = false;
      startMastery = mastery;
      input.value = "";
      $("home").hidden = true;
      $("round").hidden = false;
      $("settled").hidden = true;
      input.hidden = false;
      renderRound();
      input.focus();
    }

    function finishRound(kinds) {
      settled = true;
      input.blur();
      input.hidden = true;
      $("settled").hidden = false;
      renderRound();
      if (kinds.includes("clear")) clearedToday = true;
      if (!kinds.length) return;
      setTimeout(() => {
        if (document.activeElement === input) return;
        playC(kinds);
      }, 140);
    }

    input.addEventListener("input", () => {
      if (settled) return;
      const raw = input.value.toLowerCase().replace(/[^a-z]/g, "");
      if (target.startsWith(raw) && raw.length === typed.length + 1) {
        typed = raw;
        const prev = mastery;
        mastery = Math.min(1, mastery + 0.018);
        input.classList.add("flash");
        setTimeout(() => input.classList.remove("flash"), 55);
        if (typed === target) {
          streak += 1;
          if (queue.length === 0) {
            finishRound(cinemaKinds(true, mastery - startMastery));
          } else {
            const crossed = prev < 0.5 && mastery >= 0.5;
            target = queue.shift();
            typed = "";
            input.value = "";
            if (streak === 5 || streak === 10 || streak === 20) playB("streak");
            else if (crossed) playB("leap");
          }
        }
        renderRound();
      } else if (target.startsWith(raw) && raw.length < typed.length) {
        typed = raw;
      } else {
        input.value = typed;
      }
    });

    function playB(kind) {
      playLayer("b", kind, kind === "streak" ? 1000 : 950);
    }

    function playC(kinds) {
      if (document.activeElement === input) return;
      playingC = true;
      fromMastery = startMastery;
      const kind = kinds.includes("clear") && kinds.includes("upgrade") ? "merge" : kinds[0];
      playLayer("c", kind, kinds.includes("upgrade") ? 2500 : 2200);
    }

    function applyHero(kind, fill) {
      const t = titlesFor(kind);
      $("cineTitle").textContent = t[0];
      $("cineSub").textContent = t[1];
      $("heroPct").textContent = Math.round(fill * 100) + "%";
      setRing($("ringFill"), fill);
    }

    function easeOut(t) {
      const x = Math.min(1, Math.max(0, t));
      return 1 - Math.pow(1 - x, 3);
    }
    function meterFill(elapsed, from, to) {
      if (elapsed < 0.15) return from;
      if (elapsed >= 0.90) return to;
      return from + (to - from) * easeOut((elapsed - 0.15) / 0.75);
    }
    function sizeCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function playLayer(mode, kind, duration) {
      const layer = $("layer");
      if (reduceMotion) {
        layer.className = "on " + mode;
        applyHero(kind, mastery);
        $("cineCopy").style.opacity = "1";
        clearTimeout(playLayer._t);
        playLayer._t = setTimeout(stopLayer, 360);
        return;
      }
      layer.className = "on " + mode;
      applyHero(kind, mastery);
      sizeCanvas();
      const start = performance.now();
      cancelAnimationFrame(cinemaTimer);
      const tick = (now) => {
        const p = Math.min(1, (now - start) / duration);
        if (mode === "c") {
          const elapsed = p * (duration / 1000);
          applyHero(kind, meterFill(elapsed, fromMastery, mastery));
          $("cineCopy").style.opacity = elapsed >= 0.90 ? String(Math.min(1, (elapsed - 0.90) / 0.28)) : "0";
          drawClimax(elapsed, duration / 1000);
        } else {
          $("cineCopy").style.opacity = "1";
          drawSmall(p);
        }
        if (p < 1) cinemaTimer = requestAnimationFrame(tick);
        else stopLayer();
      };
      cinemaTimer = requestAnimationFrame(tick);
    }

    function stopLayer() {
      $("layer").className = "";
      cancelAnimationFrame(cinemaTimer);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      playingC = false;
    }

    function drawSmall(progress) {
      const w = innerWidth, h = innerHeight, env = progress < 0.18 ? progress / 0.18 : progress > 0.72 ? Math.max(0, 1 - (progress - 0.72) / 0.28) : 1;
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.42;
      ctx.fillStyle = `rgba(164,139,255,${0.28 * env})`;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(w, h) * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawClimax(elapsed, duration) {
      const w = innerWidth, h = innerHeight;
      const dim = elapsed < 0.2 ? 0.64 * (elapsed / 0.2) : elapsed > duration - 0.4 ? 0.64 * Math.max(0, 1 - (elapsed - (duration - 0.4)) / 0.4) : 0.64;
      const cx = w * 0.5, cy = h * 0.38;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = `rgba(4,3,12,${dim})`;
      ctx.fillRect(0, 0, w, h);
      if (elapsed >= 0.4 && elapsed <= 1.6) {
        const local = elapsed - 0.4;
        for (let i = 0; i < 24; i++) {
          const u = (i * 1.618) % 1;
          const delay = u * 0.16;
          const life = 0.75 + u * 0.4;
          if (local < delay || local - delay > life) continue;
          const t = (local - delay) / life;
          const angle = i * (Math.PI * 2 / 24) + u * 0.18;
          const dist = 112 + t * w * 0.42;
          ctx.globalAlpha = 0.96 * (1 - t);
          ctx.fillStyle = i % 3 === 2 ? "#ffdcb8" : i % 2 ? "#a48bff" : "#6c4cf0";
          ctx.fillRect(cx + Math.cos(angle) * dist - 6, cy + Math.sin(angle) * dist * 0.84 + t * t * 32, 10, 3);
          ctx.globalAlpha = 1;
        }
      }
    }

    $("start").onclick = startRound;
    $("backHome").onclick = () => {
      $("round").hidden = true;
      $("home").hidden = false;
      renderHome();
    };
    $("continue").onclick = stopLayer;
    renderHome();
    if (params.get("autostart") === "1") startRound();
  </script>
</body>
</html>
