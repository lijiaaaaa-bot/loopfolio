<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持 · Loopfolio</title>
  <style>
    :root { color-scheme: light dark; --ink: #14121f; --soft: #615d77; --accent: #6c4cf0; --bg: #f5f3ff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f3f1fe; --soft: #a7a3bd; --accent: #a48bff; --bg: #0c0b12; } }
    body { margin: 0; font: 18px/1.55 ui-rounded, "SF Pro Text", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.4rem 4rem; }

<body>
  <main>
    <p><a href="../">Loopfolio</a> · <a href="../privacy/">隐私</a></p>
    <h1>支持</h1>
    <p class="lede">打字回合不需要网络。AI 讲解需要你自己的 DeepSeek 密钥。</p>
    <h2>怎么玩</h2>
    <p>点「开始一局」。看卡片上的中文释义，用键盘敲英文并回车。对了进入下一题；错了会停住，照着格子把单词抄对再继续。齿轮里可以换雅思 / GRE / 并集，以及每日新词上限。</p>
    <h2>AI 讲解不可用</h2>
    <p>到设置保存 DeepSeek API Key。密钥只进本机钥匙串。没有密钥时，打字和词卡仍然可用。</p>
    <h2>进度丢了</h2>
    <p>进度在本机，不换机、不卸载就不会丢。目前没有 iCloud 同步。</p>
    <h2>联系</h2>
    <p><a href="mailto:304471720@qq.com">304471720@qq.com</a></p>
  </main>
</body>
