# Why: xcodegen app target so nobody has to hand-edit a .xcodeproj. Debug builds expose the
# celebration lab from Settings; Release hides it (#if DEBUG).
name: Loopfolio
options:
  bundleIdPrefix: com.jiajiali
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  wordloop-ios:
    path: .
targets:
  Loopfolio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Loopfolio
    dependencies:
      - package: wordloop-ios
        product: LoopfolioUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiajiali.loopfolio
        PRODUCT_NAME: Loopfolio
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loopfolio
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
